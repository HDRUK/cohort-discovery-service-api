name: Build and deploy to DEV
run-name:  ${{ github.actor }} triggered deploy to DEV pipeline

on:
  push:
    branches:
      - dev

  workflow_dispatch:
    inputs:
      env:
        description: Environment
        required: true
        default: dev-standalone
        type: choice
        options:
          - dev-standalone

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      docker_build_args: ${{ steps.args.outputs.docker_build_args }}

    steps:
      - id: args
        run: |
          ARGS=""
          ARGS+="--secret id=github_token,env=GITHUB_TOKEN "
          echo "docker_build_args=$ARGS" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    uses: HDRUK/github-actions-templates/.github/workflows/docker-build.yaml@main
    with:
      chart_path: chart/cohort-api/Chart.yaml
      docker_build_args: ${{ needs.setup.outputs.docker_build_args }}
      environment: ${{ github.event_name == 'push' && 'dev-integrated' || 'dev-standalone' }}

    secrets: inherit

  deploy-integrated:
    if: github.event_name == 'push'
    needs: build
    uses: HDRUK/github-actions-templates/.github/workflows/deploy-release.yml@main
    with:
      env: dev-integrated
      chart_path: chart/cohort-api/Chart.yaml
      git_ref: dev
    secrets: inherit

  deploy-standalone:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[deploy-standalone]'))
    needs: build
    uses: HDRUK/github-actions-templates/.github/workflows/deploy-release.yml@main
    with:
      env: dev-standalone
      chart_path: chart/cohort-api/Chart.yaml
      git_ref: ${{ github.ref_name }}
    secrets: inherit